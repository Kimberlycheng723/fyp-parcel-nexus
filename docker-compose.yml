services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parcel_nexus_frontend
    restart: unless-stopped
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parcel_nexus_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-5000}
      DATABASE_URL: postgres://${POSTGRES_USER:-parcel_nexus_user}:${POSTGRES_PASSWORD:-parcel_nexus_password}@postgres:5432/${POSTGRES_DB:-parcel_nexus}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace_with_a_long_random_access_secret}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET:-replace_with_a_long_random_reset_secret}
      JWT_ACTIVATION_SECRET: ${JWT_ACTIVATION_SECRET:-replace_with_a_long_random_activation_secret}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-superadmin@parcelnexus.local}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-ChangeMe_StrongPassword123!}
      SEED_SUPER_ADMIN_FIRST_NAME: ${SEED_SUPER_ADMIN_FIRST_NAME:-System}
      SEED_SUPER_ADMIN_LAST_NAME: ${SEED_SUPER_ADMIN_LAST_NAME:-Owner}
      SEED_SUPER_ADMIN_PHONE: ${SEED_SUPER_ADMIN_PHONE:-0123456789}
      DEV_ACTIVATION_EMAIL: ${DEV_ACTIVATION_EMAIL:-admin@parcelnexus.local}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: parcel_nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parcel_nexus}
      POSTGRES_USER: ${POSTGRES_USER:-parcel_nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcel_nexus_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcel_nexus_user} -d ${POSTGRES_DB:-parcel_nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  backend_node_modules:
  postgres_data:
